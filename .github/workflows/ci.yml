name: CI/CD Sonora

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Étape 1 : Backend ───────────────────────────────────────
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & tests avec JaCoCo
        run: mvn verify --no-transfer-progress
        working-directory: ./backend

      - name: Publier rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Vérifier couverture >= 70%
        run: |
          COVERAGE=$(grep -Po 'Total.*?([0-9]+)%' backend/target/site/jacoco/index.html | tail -1 | grep -Po '[0-9]+')
          echo "Couverture : $COVERAGE%"
          if [ "$COVERAGE" -lt 70 ]; then
            echo "Couverture insuffisante ($COVERAGE% < 70%)"
            exit 1
          fi

  # ─── Étape 2 : Frontend ──────────────────────────────────────
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Angular
        run: |
          npm ci
          npm run build -- --configuration production
        working-directory: ./frontend

  # ─── Étape 3 : Docker (push seulement) ──────────────────────
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image Spring Boot
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sonora-backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/sonora-backend:latest

  # ─── Étape 4 : Déploiement (main seulement) ──────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Tag image avec version Git
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "Déploiement version $TAG"
          # Ajoute ici ta commande de déploiement (SSH, kubectl, etc.)
