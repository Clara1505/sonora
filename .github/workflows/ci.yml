name: CI/CD Sonora

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [dev, main]
    tags:
      - 'v*'
  pull_request:
    branches: [dev, main]

jobs:

  # ─── Étape 1 : Backend ───────────────────────────────────────
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sonora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      kafka:
        image: apache/kafka:4.2.0
        env:
          KAFKA_NODE_ID: 0
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
          KAFKA_LISTENERS: BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: BROKER://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: "0@localhost:9093"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_DEFAULT_REPLICATION_FACTOR: 1
          KAFKA_NUM_PARTITIONS: 1
        ports:
          - 9092:9092

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & tests avec JaCoCo
        run: mvn verify --no-transfer-progress
        working-directory: ./backend

      - name: Publier rapport JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Vérifier couverture >= 80%
        run: |
          COVERAGE=$(grep -Po 'Total.*?([0-9]+)%' backend/target/site/jacoco/index.html | tail -1 | grep -Po '[0-9]+')
          echo "Couverture : $COVERAGE%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "Couverture insuffisante ($COVERAGE% < 80%)"
            exit 1
          fi

      # ── Analyse statique backend (Checkstyle) ──────────────────
      - name: Analyse statique Checkstyle
        run: mvn checkstyle:check --no-transfer-progress
        working-directory: ./backend

      - name: Publier rapport Checkstyle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: backend/target/checkstyle-result.xml

  # ─── Étape 2 : Frontend ──────────────────────────────────────
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Générer environment.ts
        run: |
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: false,
            apiUrl: 'http://localhost:8080',
            spotify: {
              clientId: '${{ secrets.SPOTIFY_CLIENT_ID }}',
              clientSecret: '${{ secrets.SPOTIFY_CLIENT_SECRET }}'
            }
          };
          EOF
        working-directory: ./frontend

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular (production)
        run: npm run build -- --configuration production
        working-directory: ./frontend

      # ── Tests unitaires Angular (Vitest) ───────────────────────
      - name: Tests unitaires Angular
        run: npm test -- --watch=false
        working-directory: ./frontend

      - name: Publier rapport de tests frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: frontend/test-results/

      # ── Analyse statique frontend (ESLint) ─────────────────────
      - name: Analyse statique ESLint
        run: npm run lint
        working-directory: ./frontend

  # ─── Étape 3 : Docker (push sur dev/main seulement) ─────────
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repo
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build & Push image Spring Boot
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/sonora-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/sonora-backend:latest

  # ─── Étape 4 : Déploiement (tag v* seulement) ────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Processus de release automatisé ───────────────────────
      - name: Déterminer la version
        id: version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Déploiement version $TAG"

      - name: Générer les release notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "NOTES<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Sonora ${{ steps.version.outputs.TAG }}"
          body: |
            ## Changements
            ${{ steps.release_notes.outputs.NOTES }}

            ## Image Docker
            `ghcr.io/${{ github.repository }}/sonora-backend:${{ steps.version.outputs.TAG }}`
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false