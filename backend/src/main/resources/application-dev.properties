# ── Profil développement local ──────────────────────────────────
# Activé avec : -Dspring.profiles.active=dev
# ou via SPRING_PROFILES_ACTIVE=dev dans votre .env

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sonora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# En dev on laisse Hibernate gérer le schéma automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Swagger activé uniquement en dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
