spring.application.name=sonora

# ── DataSource ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://sonora-db:5432/sonora
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Kafka ────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=kafka-0:9092,kafka-1:9092,kafka-2:9092
spring.kafka.consumer.group-id=sonora-group
spring.kafka.consumer.auto-offset-reset=earliest

# ── Multipart (upload MP3/WAV) ───────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Swagger ──────────────────────────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ── JWT ──────────────────────────────────────────────────────────
jwt.secret=SuperSecretKeySonora2025MustBeAtLeast256BitsLong!!
jwt.expiration-ms=86400000
