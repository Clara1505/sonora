spring.application.name=sonora

# ── DataSource ──────────────────────────────────────────────────
# Toutes les valeurs sensibles sont lues depuis les variables d'environnement.
# Voir .env.example pour la liste complète des variables requises.
spring.datasource.url=${DB_URL:jdbc:postgresql://sonora-db:5432/sonora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate : Hibernate vérifie le schéma sans le modifier.
# Les migrations sont gérées par Flyway (voir resources/db/migration/).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Kafka ────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-0:9092,kafka-1:9092,kafka-2:9092}
spring.kafka.consumer.group-id=sonora-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# ── Multipart (upload MP3/WAV) ───────────────────────────────────
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ── Swagger ──────────────────────────────────────────────────────
# Désactivé par défaut ; activé uniquement en dev via application-dev.properties
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ── JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Flyway ───────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Increase logging for security components to help debug JWT handling
logging.level.com.sonora.sonora.security=DEBUG
