# Override pour les tests CI : pointe vers le service GitHub Actions
spring.datasource.url=jdbc:postgresql://localhost:5432/sonora
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# create-drop : Hibernate gère le schéma directement en test
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway désactivé en test — le schéma est géré par Hibernate (create-drop)
spring.flyway.enabled=false

spring.kafka.bootstrap-servers=localhost:9092

# Secret de test uniquement — ne jamais utiliser en production
jwt.secret=${JWT_SECRET:test-secret-key-for-ci-only-32chars!}
jwt.expiration-ms=86400000
