@if (state && state.trackId) {
  <div class="player-bar">

    <div class="track-info">
      <div class="track-cover">
        <mat-icon>music_note</mat-icon>
      </div>
      <div class="track-details">
        <span class="track-title">{{ state.trackTitle }}</span>
        <span class="track-artist">{{ state.artistName }}</span>
      </div>
      <button mat-icon-button class="favorite-btn"
              [matTooltip]="isFavorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'"
              (click)="toggleFavorite()">
        <mat-icon [style.color]="isFavorite() ? '#e91e63' : ''">
          {{ isFavorite() ? 'favorite' : 'favorite_border' }}
        </mat-icon>
      </button>
    </div>

    <!-- Contrôles -->
    <div class="player-controls">
      <div class="control-buttons">
        <button mat-icon-button matTooltip="Précédent"
                [disabled]="!hasPrevious"
                (click)="previous()">
          <mat-icon>skip_previous</mat-icon>
        </button>
        <button mat-fab color="primary" class="play-btn" (click)="togglePlay()">
          <mat-icon>{{ state.isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Suivant"
                [disabled]="!hasNext"
                (click)="next()">
          <mat-icon>skip_next</mat-icon>
        </button>
      </div>
      <div class="progress-bar">
        <span class="time">{{ formatTime(state.currentTime) }}</span>
        <input
          type="range"
          class="progress-slider"
          [max]="state.duration || 0"
          [min]="0"
          [step]="1"
          [value]="state.currentTime"
          (change)="onSeek($event)">
        <span class="time">{{ formatTime(state.duration) }}</span>
      </div>
    </div>

    <!-- Volume -->
    <div class="volume-controls">
      <button mat-icon-button (click)="toggleMute()">
        <mat-icon>{{ state.isMuted || state.volume === 0 ? 'volume_off' : state.volume < 50 ? 'volume_down' : 'volume_up' }}</mat-icon>
      </button>
      <input
        type="range"
        class="volume-slider"
        [max]="100"
        [min]="0"
        [step]="1"
        [value]="state.volume"
        (change)="onVolumeChange($event)">
    </div>

  </div>
}
